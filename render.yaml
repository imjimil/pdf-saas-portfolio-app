# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The backend runs as a Docker image because high-fidelity PDF work needs real
# document engines (LibreOffice, Ghostscript, qpdf, Poppler, Tesseract) that do
# not exist in Render's plain Node runtime.
services:
  - type: web
    name: mypdftools-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
