# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Runs as plain Node (no Docker). PDF tools use npm libraries:
# @cantoo/pdf-lib, pdfjs-dist, docx, mammoth, sharp — all work on the free tier.
# Optional SMTP env vars forward contact form messages to your inbox.
services:
  - type: web
    name: mypdftools-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
